name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Every test binary links LLVM statically; without debug info they stay small enough.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  # The helper bitcode is built on Linux x86-64 only (scripts/build-libtcg.sh);
  # macOS uses this one.
  helpers:
    name: Helper bitcode
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/upload-artifact@v7
        with:
          name: helpers
          path: .deps/out/helpers-*.bc
          if-no-files-found: error

  linux:
    name: Linux x86-64
    needs: helpers
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Build
        run: cargo build --workspace --all-targets --locked
      - name: Test
        run: cargo test --workspace --locked --no-fail-fast

  macos:
    name: macOS arm64
    needs: helpers
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: helpers
          path: .deps/out
      - name: Build
        run: cargo build --workspace --all-targets --locked
      - name: Diagnose the link (temporary)
        if: failure()
        run: |
          cat > "$RUNNER_TEMP/cc-wrap" <<'EOF'
          #!/bin/bash
          cc "$@" > "$LINK_LOG" 2>&1; rc=$?; echo "exit status $rc" >> "$LINK_LOG"; exit $rc
          EOF
          chmod +x "$RUNNER_TEMP/cc-wrap"
          try() {
            echo "=== $1"
            LINK_LOG="$RUNNER_TEMP/$1.log" cargo rustc -p biara-cli --bin biara --locked -- \
              -C linker="$RUNNER_TEMP/cc-wrap" "${@:2}" > /dev/null 2>&1 || true
            tail -c 3000 "$RUNNER_TEMP/$1.log"
          }
          try default -C link-arg=-Wl,-v
          try classic -C link-arg=-Wl,-ld_classic
          try lld -C link-arg=--ld-path=$PWD/.deps/llvm-23.1.2/bin/ld64.lld
      - name: Test
        run: cargo test --workspace --locked --no-fail-fast
