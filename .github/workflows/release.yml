name: Release

# Builds the Linux x86-64 and macOS arm64 archives (binaries with their lifters) for every push
# and manual run. A branch's latest successful build replaces the assets of its rolling
# pre-release `build-<branch>` (what scripts/install.sh downloads, without signing in); a `v*`
# tag publishes a versioned release. Both carry the GPL source of the lifters.
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

# A newer commit on the same branch supersedes an unfinished build; tags always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read
  actions: read # the macOS build polls this run's artifacts for the helper bitcode

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      matrix:
        include:
          - platform: x86_64-linux
            runner: ubuntu-24.04
          - platform: arm64-macos
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # The helper bitcode is a Linux build (scripts/build-libtcg.sh): macOS waits for it.
      - name: Share the helper bitcode
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: helpers
          path: .deps/out/helpers-*.bc
          if-no-files-found: error
      - name: Wait for the helper bitcode
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 120); do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              --jq '.artifacts[].name' | grep -qx helpers && exit 0
            sleep 30
          done
          echo "no helper bitcode from the Linux build" >&2
          exit 1
      - name: Fetch the helper bitcode
        if: runner.os == 'macOS'
        uses: actions/download-artifact@v8
        with:
          name: helpers
          path: .deps/out

      - name: Build
        run: cargo build --release --locked -p biara-cli -p biara-ui

      - name: Package
        run: |
          source scripts/versions.sh
          version=${GITHUB_REF_NAME#v}
          [[ $GITHUB_REF_TYPE == tag ]] || version=$(git rev-parse --short HEAD)
          name=biara-$version-${{ matrix.platform }}
          mkdir -p dist/$name
          # biara and biara-ui find the lifters next to the executable; `biara update` runs
          # the install script that came with it.
          cp target/release/biara target/release/biara-ui .deps/out/libtcg-*.$DSO \
            .deps/out/helpers-*.bc scripts/install.sh dist/$name/
          cp -R LICENSE THIRD_PARTY_NOTICES.md README.md licenses dist/$name/
          cp patches/README.md dist/$name/LIFTERS-LICENSE.md

          if [[ $RUNNER_OS == macOS ]]; then
            # The lifters link Homebrew's GLib (and what it links): ship those next to them,
            # loaded from there, and re-sign what install_name_tool changed.
            bundle() {
              local dep base
              for dep in $(otool -L "$1" | tail -n +2 | awk '{print $1}' \
                  | grep -v -e '^/usr/lib/' -e '^/System/' -e '^@'); do
                base=$(basename "$dep")
                if [[ ! -f dist/$name/$base ]]; then
                  cp "$dep" "dist/$name/$base"
                  chmod u+w "dist/$name/$base"
                  install_name_tool -id "@loader_path/$base" "dist/$name/$base"
                  bundle "dist/$name/$base"
                fi
                install_name_tool -change "$dep" "@loader_path/$base" "$1"
              done
              codesign --force --sign - "$1"
            }
            for f in dist/$name/biara dist/$name/biara-ui dist/$name/libtcg-*.dylib; do
              bundle "$f"
            done
            # Everything now resolves to the system or to the archive.
            otool -L dist/$name/biara dist/$name/biara-ui dist/$name/*.dylib
            ! otool -L dist/$name/biara dist/$name/biara-ui dist/$name/*.dylib \
              | grep -v '^dist/' | grep -v -e '/usr/lib/' -e '/System/Library/' -e '@loader_path/'
          fi
          tar -C dist -cJf dist/$name.tar.xz $name

          # libtcg-* and helpers-*.bc are GPL binaries: ship their corresponding source
          # (one archive covers both platforms).
          if [[ $RUNNER_OS == Linux ]]; then
            src=biara-$version-lifters-source
            mkdir -p dist/$src/scripts
            cp .deps/dl/qemu-$QEMU_VERSION.tar.xz dist/$src/
            cp -R patches libtcg dist/$src/
            cp scripts/versions.sh scripts/fetch-deps.sh scripts/build-libtcg.sh \
              scripts/helper-bitcode.py dist/$src/scripts/
            tar -C dist -cJf dist/$src.tar.xz $src
          fi
          ls -l dist

      # Installed by its install script, the archive decompiles on its own: lifters, helpers
      # and (macOS) the bundled libraries load from it through the bin links.
      - name: Smoke-test the archive
        run: |
          tmp=$(mktemp -d)
          sh scripts/install.sh --archive dist/biara-*-${{ matrix.platform }}.tar.xz \
            --home "$tmp/home" --bin "$tmp/bin" --no-modify-path
          printf '%s\n' '__attribute__((noinline)) long triple(long x) { return x * 3 + 1; }' \
            'void _start(void) { for (;;) triple(2); }' > "$tmp/guest.c"
          .deps/llvm-23.1.2/bin/clang --target=x86_64-linux-gnu -O1 -ffreestanding -nostdlib \
            -static -fuse-ld=lld "$tmp/guest.c" -o "$tmp/guest"
          "$tmp/bin/biara" lift "$tmp/guest" triple --emit decomp \
            --database "$tmp/db.sqlite" | tee "$tmp/out.txt"
          grep -q triple "$tmp/out.txt"

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.platform }}
          path: dist/*.tar.xz
          if-no-files-found: error

  branch:
    name: Publish the branch build
    needs: build
    if: github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Update the rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # Keep in sync with scripts/install.sh.
          tag=build-$(printf '%s' "$BRANCH" | tr -c 'A-Za-z0-9._-' '-')
          # Stable asset names (the archives' directories keep the commit).
          mkdir upload
          for f in dist/*.tar.xz; do
            cp "$f" "upload/$(basename "$f" | sed 's/^biara-[^-]*-/biara-/')"
          done
          (cd upload && sha256sum *.tar.xz > SHA256SUMS)
          ls -l upload
          notes="Latest successful build of \`$BRANCH\` ($GITHUB_SHA).

          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/scripts/install.sh | sh -s -- --branch $BRANCH
          \`\`\`"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$tag" upload/* --clobber --repo "$GITHUB_REPOSITORY"
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" \
              -f sha="$GITHUB_SHA" -F force=true > /dev/null
            gh release edit "$tag" --notes "$notes" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" upload/* --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "Build of $BRANCH" --notes "$notes" --repo "$GITHUB_REPOSITORY"
          fi

  publish:
    name: Publish
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum *.tar.xz > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" *.tar.xz SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
