# Toolchain locations produced by scripts/fetch-deps.sh and
# scripts/build-libtcg.sh (versions pinned in scripts/versions.sh).
[env]
LLVM_SYS_231_PREFIX = { value = ".deps/llvm-sys-23.1.2", relative = true }
LIBCLANG_PATH = { value = ".deps/llvm-23.1.2/lib", relative = true }
# bindgen asks this clang for its built-in include directory (stddef.h); without it, it needs
# a system clang on PATH.
CLANG_PATH = { value = ".deps/llvm-23.1.2/bin/clang", relative = true }
BIARA_LIBTCG_DIR = { value = ".deps/out", relative = true }
# Cross-compiles the AArch64 test corpus (crates/biara-lift/tests/aarch64.rs).
BIARA_CLANG = { value = ".deps/llvm-23.1.2/bin/clang", relative = true }
# The macOS the LLVM release's libraries are built for (ignored elsewhere).
MACOSX_DEPLOYMENT_TARGET = "14.0"

# The macOS LLVM release ships its static libraries as LLVM 23 bitcode, which Apple's linker
# (LLVM 17 inside) cannot read: link with the release's own clang and lld. The ThinLTO cache
# spares the many test binaries from compiling LLVM's bitcode again on every link. zstd and
# liblzma come from Homebrew's static archives (scripts/fetch-deps.sh). Paths are relative to
# the workspace root, where rustc runs.
[target.aarch64-apple-darwin]
linker = ".deps/llvm-23.1.2/bin/clang"
rustflags = [
    "-C", "link-arg=-fuse-ld=lld",
    "-C", "link-arg=-Wl,-cache_path_lto,target/lto-cache",
    "-L", "native=.deps/macos-static",
]
